[package]
name = "vaultx"
version = "0.1.0"
description = "VaultX Solana vault platform program"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "vaultx"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
proc-macro2 = { version = "1", features = ["span-locations"] }

[patch.crates-io]
anchor-syn = { path = "../../vendor/anchor-syn-0.30.1" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
